
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xhtml="http://www.w3.org/1999/xhtml"
     width="100%" height="100%"
     viewBox="0 0 100 100"
     preserveAspectRatio="none"
     style="position:fixed;inset:0;width:100vw;height:100vh;">

  <foreignObject x="0" y="0" width="100" height="100">
    <body xmlns="http://www.w3.org/1999/xhtml"
          style="margin:0;width:100vw;height:100vh;overflow:hidden;">

      <iframe id="test"
        style="position:fixed;inset:0;width:100vw;height:100vh;border:0;margin:0;padding:0;">
      </iframe>

      <script>
        const target =
          "https://cdn.jsdelivr.net/gh/xenonsan/dogeub_static@main/index.html";

        const frame = document.getElementById("test");

        frame.srcdoc = `
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <style>
              html,body {
                margin:0;
                width:100%;
                height:100%;
              }
            </style>
          </head>
          <body>
            <script>
              location.replace(${JSON.stringify(target)});
            <\/script>
          </body>
          </html>
        `;
      </script>

    </body>
  </foreignObject>
</svg>
