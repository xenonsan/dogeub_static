
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xhtml="http://www.w3.org/1999/xhtml"
     width="100%"
     height="100%"
     viewBox="0 0 100 100"
     preserveAspectRatio="none">

  <foreignObject x="0" y="0" width="100" height="100">
    <xhtml:div style="
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    ">
      <xhtml:iframe
        src="https://cdn.jsdelivr.net/gh/xenonsan/dogeub_static@main/index.html"
        style="
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          border: none;
          margin: 0;
          padding: 0;
        "
        allowfullscreen="true">
      </xhtml:iframe>
    </xhtml:div>
  </foreignObject>
</svg>
